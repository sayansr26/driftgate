# Driftgate's own canonical config. This repository dogfoods itself: AGENTS.md, CLAUDE.md,
# GEMINI.md, .cursor/rules/*.mdc and .github/copilot-instructions.md are generated from the
# rules below, and are not edited by hand. Change a rule here, run `driftgate sync`, commit
# the rule and every regenerated file together.
schemaVersion: 1
tools:
  - aider
  - claude-code
  - cline
  - codex
  - copilot
  - cursor
  - roo-code
  - windsurf
  - zed
  - gemini

options:
  # doctor only. `fixtures/` holds instruction files as *test data* — every golden
  # CLAUDE.md, AGENTS.md and GEMINI.md under it is input to a byte-exact comparison, not a
  # rule any tool loads — so the orphan scan would otherwise report ~30 of them. Nothing
  # Driftgate generates is affected: `sync` and `check` do not read this key.
  ignore:
    - fixtures/**
