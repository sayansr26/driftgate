# CI (T029).
#
# Six cells, because the two properties this project sells are both platform-sensitive:
# byte-identical output (NFR4) and an exit code CI can trust. Windows is the reason the
# matrix exists at all — path separators and CRLF are where deterministic rendering breaks
# — so a green Linux run is not evidence.
#
# Every job runs on a checkout only, never against a published package, except the smoke
# job, which installs the packed tarballs the way a user would.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Every cell reports. A Windows-only failure that hides behind a cancelled matrix is
      # the failure this matrix exists to find.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Before the build on purpose: eslint must resolve the workspace from source on a
      # clean clone, which is the state a contributor and this runner are both in.
      - run: pnpm lint

      - run: pnpm build

      - run: pnpm typecheck

      # Unit and fixture tests. The goldens under fixtures/ are asserted byte-exact, and
      # `.gitattributes` keeps Git from rewriting their line endings on a Windows checkout.
      #
      # DRIFTGATE_REQUIRE_SYMLINKS turns the symlink suite's self-skip into a failure. That
      # suite skips itself where the platform refuses to create a symlink — Windows without
      # developer mode — and coverage that silently skips is coverage nobody has. If the
      # Windows image cannot create one, the red cell is honest information and the variable
      # gets scoped to the other cells; that decision needs the first real run to inform it.
      - run: pnpm test
        env:
          DRIFTGATE_REQUIRE_SYMLINKS: '1'

      # The same suite against the built dist/, which is the only lane that catches a
      # broken `exports` map or a regressed exit code. It has already caught one.
      - run: pnpm test
        env:
          DRIFTGATE_TEST_DIST: '1'

      # Dogfooding, as a gate. This repository's CLAUDE.md, AGENTS.md, GEMINI.md,
      # .cursor/rules/*.mdc and .github/copilot-instructions.md are generated; if a rule
      # changed and `sync` was not run, this is where it is caught — by the product.
      - name: driftgate check (dogfood)
        run: node packages/cli/dist/bin.js check

      # The Action's bundle is committed (a runner does no `npm install` before running
      # it), so it can go stale the moment somebody edits action/src and forgets to
      # rebuild — and a stale bundle keeps working while reporting an older commit's
      # behaviour. This also proves the bundle is byte-identical across platforms and Node
      # versions, which a committed build has to be.
      - name: action bundle is current
        run: node action/build.mjs --check

      # The precedence pages under docs/tools/ and the adapter registry are generated from
      # each adapter's `docs.ts`. Committed and stale, they are worse than absent: they are
      # the project's most public claim about what each tool reads, and a wrong one is a
      # bug report filed against the vendor. Run on all six cells because byte-identical
      # generated output across platforms and Node versions is the NFR4 claim, which is why
      # the Action bundle check above is here too.
      - name: generated docs are current
        run: node scripts/generate-docs.mjs --check

  smoke:
    name: install and run end to end
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Packs every workspace package, installs the CLI from those tarballs, and runs
      # init -> sync -> check on a throwaway repository — including the drift case, which
      # must exit 1 with a diff. See scripts/smoke.mjs for why this is not literally npx.
      - run: node scripts/smoke.mjs

  action:
    name: run the action as an action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `uses: ./action` is the only thing that exercises action.yml itself — its inputs,
      # its `node20` runtime, and the committed bundle as the runner resolves it. Nothing
      # else in this workflow does: the dist lane spawns `node action/dist/main.js`
      # directly, which proves the code and not the packaging.
      #
      # This repository is in sync, so the Action must pass. The failing direction is
      # covered by the dist lane, which asserts exit 1 and the annotations on a drifted
      # fixture — a job cannot assert its own failure without `continue-on-error`, which
      # would also hide a real one.
      - name: driftgate check via the action
        uses: ./action
        with:
          annotations: 'true'

  format:
    name: prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # One cell only: formatting cannot differ by platform, and `.prettierignore` keeps
      # the formatter off every generated path — a formatter and a generator cannot both
      # own a file.
      - run: pnpm format
